kind = "web"
previewPath = "/"
title = "Pixel School Simulator"
description = "A responsive browser-based 2D pixel-art school simulation prototype with a tile grid, layered rendering, scheduled periods, pathfinding students, and keyboard and touch controls."
version = "1.0.0"
id = "artifacts/pixel-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21130

[services.development]
run = "pnpm --filter @workspace/pixel-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixel-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/pixel-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21130"
BASE_PATH = "/"
