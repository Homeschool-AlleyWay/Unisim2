# Netlify: build the Maple Grove app (Vite) and publish it. /academy is static; /api/broadcast is the newsroom's feed function.
[build]
  command = "pnpm --filter @workspace/pixel-school run build"
  publish = "artifacts/pixel-school/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PORT = "3000"
  BASE_PATH = "/"

# Flip phone shortcut (a standalone installable web app inside the academy build).
[[redirects]]
  from = "/phone"
  to = "/academy/phone.html"
  status = 200

# Single-page app: unknown paths (e.g. /classroom, /characters) fall back to the app. Real files such as /academy/index.html win first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/academy/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/academy/phone-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
